services:
  mongodb:
    image: mongo:7
    container_name: climasense-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: climasense-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: climasense-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - mosquitto
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/climasense
      MQTT_URL: mqtt://mosquitto:1883
      DATA_SOURCE: ${DATA_SOURCE:-mongodb}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
      FIREBASE_DATABASE_AUTH: ${FIREBASE_DATABASE_AUTH:-}
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: replace_me

volumes:
  mongodb-data:
  mosquitto-data:
  mosquitto-log:
